body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;margin:0;font-weight:600;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:72ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem;color:var(--muted)}

.ctl label{font-size:.85rem;color:var(--muted);white-space:nowrap}
select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);max-width:100%;min-width:0}
.graph{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:70vh}
svg text{font-family:var(--font-body);font-size:12px;fill:var(--fg)}
.node{cursor:pointer}
.node rect.box{fill:var(--panel);stroke:var(--line);stroke-width:1}
.node.star rect.box{stroke-dasharray:4 3}
.node:focus{outline:none}
.node:focus rect.box{stroke:var(--fg);stroke-width:2}
.node.sel rect.box{stroke:var(--fg);stroke-width:2.5}
.node.anc rect.box{stroke:var(--pre);stroke-width:2}
.node.desc rect.box{stroke:var(--next);stroke-width:2}
.node.req rect.box{stroke:var(--req);stroke-width:2.5}
.node.bonus rect.box{stroke:var(--bonus);stroke-width:2}
.node.path rect.box{stroke:var(--pre);stroke-width:1.5}
.node.dim{opacity:.25}
path.e{fill:none;stroke:var(--edge);stroke-width:1.2}
path.e.anc,path.e.path{stroke:var(--pre);stroke-width:1.8}
path.e.desc{stroke:var(--next);stroke-width:1.8}
path.e.dim{opacity:.14}
.colhead{font-family:var(--font-mono);font-size:11px;fill:var(--muted);letter-spacing:.06em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px}
.panel h2{margin:0;font-size:1.2rem;font-weight:600;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{font-size:.75rem;font-weight:500;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.star{border-style:dashed}
.row{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:start}
.row>div{min-width:0}
.k{font-size:.8rem;color:var(--muted);letter-spacing:.04em;padding-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.85rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.chip.pre{border-color:var(--pre)}
.chip.next,.chip.bonus{border-color:var(--bonus)}
.chip.req{border-color:var(--req)}
.chip:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.courses{font-family:var(--font-mono);font-size:.82rem}
.none{color:var(--muted);font-size:.85rem}
.stat{font-variant-numeric:tabular-nums}
.lec{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:14px}
.lec h3{margin:0;font-size:1rem;font-weight:600}
.lecnote{color:var(--muted);font-size:.85rem;max-width:90ch}
.lrow{display:grid;grid-template-columns:2rem minmax(0,1fr) minmax(0,1.5fr) minmax(0,1.5fr);gap:4px 16px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.lrow.head{border-top:0;font-size:.75rem;color:var(--muted);letter-spacing:.04em;padding:8px 0 4px}
.ln{font-family:var(--font-mono);color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.lt{font-weight:500}
.lcell{font-size:.88rem;min-width:0}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;border:1px solid var(--pre);color:var(--pre);margin-right:6px}
.lcode{margin-top:4px}
@media (max-width:700px){.lrow{grid-template-columns:2rem minmax(0,1fr)}.lrow.head{display:none}.lcell{grid-column:2}.lcell::before{content:attr(data-k);display:block;font-size:.75rem;color:var(--muted)}}
@media (max-width:520px){.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.node rect.box,path.e{transition:stroke .15s,opacity .15s}.node{transition:opacity .15s}}

  ["Remote procedure calls", "RPC semantics", "Call semantics"],
  ["Replication", "Primary-backup, quorums", "Quorum sizes"],
  ["Consistency models", "Linearisability, eventual consistency", "Consistency analysis"],
  ["Consensus I", "Paxos", "Paxos traces"],
  ["Consensus II", "Raft", "Raft traces"],
  ["CAP and PACELC", "Trade-offs", "Classifying systems"],
  ["Distributed storage", "Sharding, consistent hashing", "Hash ring placement"],
  ["Distributed computation", "MapReduce, stream processing", "Dataflow reasoning"],

 ]},
 ll:{s:"Writing code that runs in microseconds: memory, cache, lock-free structures and measurement.",o:["Profile and measure latency", "Design cache-friendly and lock-free code", "Understand the trading hot path"],n:"No university course; follows low-latency trading engineering practice.",p:"Proof = N/A; Complete = pass the hardest set.",l:[
  ["Latency fundamentals", "Tail latency, percentiles", "Percentile calculations"],
  ["Measuring performance", "Benchmarking, perf tools", "Benchmark interpretation"],
  ["CPU and cache", "Cache lines, false sharing", "Cache miss counts"],
  ["Memory management", "Allocators, pools, NUMA", "Allocation costs"],
  ["Data layout", "SoA vs AoS, alignment", "Layout analysis"],
  ["Branching and compilation", "Branch prediction, inlining", "Assembly reading"],
  ["Lock-free programming", "Atomics, ring buffers", "Memory-order reasoning"],
  ["Kernel bypass", "DPDK, busy polling", "Latency budgets"],

  ["Order gateway design", "Hot path layout", "Hot-path review"],
  ["Production practice", "Monitoring, determinism", "Jitter analysis"]
 ]}
};
const M={};N.forEach(n=>{M[n.id]=n;n.k=[]});
N.forEach(n=>n.p.forEach(p=>M[p].k.push(n.id)));
const dep={};
function depth(id){if(id in dep)return dep[id];const n=M[id];dep[id]=n.p.length?1+Math.max(...n.p.map(depth)):0;return dep[id]}
N.forEach(n=>depth(n.id));
const maxD=Math.max(...Object.values(dep));
const cols=[...Array(maxD+1)].map(()=>[]);
N.forEach(n=>cols[dep[n.id]].push(n));
const W=190,H=30,GX=52,GY=10,PX=20,PY=36;
const pos={};
cols.forEach((col,ci)=>{
  if(ci===0){col.sort((a,b)=>DO.indexOf(a.d)-DO.indexOf(b.d))}
  else{col.forEach(n=>{n.bc=n.p.reduce((s,p)=>s+pos[p].row,0)/n.p.length});
    col.sort((a,b)=>a.bc-b.bc||DO.indexOf(a.d)-DO.indexOf(b.d))}
  col.forEach((n,ri)=>{pos[n.id]={row:ri,x:PX+ci*(W+GX),y:PY+ri*(H+GY)}});
});
const maxR=Math.max(...cols.map(c=>c.length));
const SW=PX*2+(maxD+1)*W+maxD*GX, SH=PY+maxR*(H+GY)+PX;
const ns="http://www.w3.org/2000/svg";
function el(t,a){const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);return e}
const svg=el("svg",{width:SW,height:SH,viewBox:`0 0 ${SW} ${SH}`,role:"img","aria-label":"Prerequisite graph"});
cols.forEach((c,ci)=>{const t=el("text",{x:PX+ci*(W+GX),y:20,class:"colhead"});t.textContent=`STAGE ${ci+1}`;svg.appendChild(t)});
const eg=el("g",{}),ng=el("g",{});svg.append(eg,ng);
const edges=[];
N.forEach(n=>n.p.forEach(p=>{
  const a=pos[p],b=pos[n.id],x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,dx=Math.max(30,(x2-x1)/2);
  const path=el("path",{class:"e",d:`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`});
  eg.appendChild(path);edges.push({from:p,to:n.id,path});
}));
const nodeEls={};
N.forEach(n=>{
  const {x,y}=pos[n.id];
  const g=el("g",{class:"node"+(n.s?" star":""),transform:`translate(${x},${y})`,tabindex:"0",role:"button","aria-label":n.l});
  g.appendChild(el("rect",{class:"box",width:W,height:H,rx:5}));
  g.appendChild(el("rect",{width:5,height:H,rx:2,fill:`var(${D[n.d][1]})`}));
  const t=el("text",{x:13,y:H/2+4});t.textContent=(n.s?"★ ":"")+n.l;g.appendChild(t);
  g.addEventListener("click",()=>select(n.id));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(n.id)}});
  ng.appendChild(g);nodeEls[n.id]=g;
});
document.getElementById("graph").appendChild(svg);

const lg=document.getElementById("legend");
function legend(mode){
  const doms=DO.map(k=>`<span><i class="sw" style="background:var(${D[k][1]})"></i>${D[k][0]}</span>`).join("");
  const m=mode==="career"
   ?`<span><i class="sw line" style="background:var(--req)"></i>Required</span><span><i class="sw line" style="background:var(--bonus)"></i>Bonus</span><span><i class="sw line" style="background:var(--pre)"></i>Prerequisites of required topics</span>`
   :`<span><i class="sw line" style="background:var(--pre)"></i>Prerequisites</span><span><i class="sw line" style="background:var(--next)"></i>Unlocks</span>`;
  lg.innerHTML=doms+m+`<span>★ Not offered by any of the four universities</span>`;
}
const pick=document.getElementById("pick"),car=document.getElementById("career");
pick.innerHTML=`<option value="">—</option>`+DO.map(k=>`<optgroup label="${D[k][0]}">`+N.filter(n=>n.d===k).map(n=>`<option value="${n.id}">${n.l}</option>`).join("")+`</optgroup>`).join("");
car.innerHTML=`<option value="">—</option>`+Object.entries(CAR).map(([k,v])=>`<option value="${k}">${v.l}</option>`).join("");
pick.addEventListener("change",()=>{if(pick.value)select(pick.value,true)});
car.addEventListener("change",()=>{if(car.value)selectCareer(car.value)});

function lecHTML(id){
  const L=LEC[id];if(!L)return"";
  const rows=L.l.map((r,i)=>`<div class="lrow"><div class="ln">${i+1}</div><div class="lt">${r[0]}</div><div class="lcell" data-k="Theory">${r[1]}</div><div class="lcell" data-k="Computation">${r[2]}${r[3]?`<div class="lcode"><span class="tag">Coding</span>${r[3]}</div>`:""}</div></div>`).join("");
  const ob=L.o?`<div class="lecnote"><b>By the end:</b></div><ul class="outs">${L.o.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";
  return `<div class="lec">${L.s?`<div class="lecnote">${L.s}</div>`:""}${ob}<h3>Course outline · ${L.l.length} lectures × 3 hours</h3><div class="lecnote">${L.n}</div><div class="lrow head"><div></div><div>Topic</div><div>Theory</div><div>Computation</div></div>${rows}${L.p?`<div class="lecnote">${L.p}</div>`:""}</div>`;
}
function walk(id,key,set){M[id][key].forEach(x=>{if(!set.has(x)){set.add(x);walk(x,key,set)}});return set}
function chips(ids,cls){return ids.length?`<div class="chips">${ids.map(i=>`<button class="chip ${cls}" data-id="${i}">${M[i].l}</button>`).join("")}</div>`:`<span class="none">None</span>`}
function bindChips(){document.querySelectorAll("#panel .chip").forEach(b=>b.addEventListener("click",()=>select(b.dataset.id,true)))}
function clear(){N.forEach(n=>nodeEls[n.id].classList.remove("sel","anc","desc","dim","req","bonus","path"));edges.forEach(e=>e.path.classList.remove("anc","desc","dim","path"))}
function select(id,scroll){
  clear();legend("topic");car.value="";pick.value=id;
  const anc=walk(id,"p",new Set()),desc=walk(id,"k",new Set());
  N.forEach(n=>{const g=nodeEls[n.id];
    if(n.id===id)g.classList.add("sel");else if(anc.has(n.id))g.classList.add("anc");else if(desc.has(n.id))g.classList.add("desc");else g.classList.add("dim")});
  edges.forEach(e=>{
    if(anc.has(e.from)&&(anc.has(e.to)||e.to===id))e.path.classList.add("anc");
    else if(desc.has(e.to)&&(desc.has(e.from)||e.from===id))e.path.classList.add("desc");
    else e.path.classList.add("dim")});
  const n=M[id];
  const used=Object.values(CAR).filter(c=>c.r.includes(id)).map(c=>c.l);
  const bon=Object.values(CAR).filter(c=>c.b.includes(id)).map(c=>c.l);
  document.getElementById("panel").innerHTML=`
   <h2>${n.l}<span class="badge">${D[n.d][0]}</span><span class="badge">Stage ${dep[id]+1}</span>${n.s?'<span class="badge star">★ Original to this app</span>':""}</h2>
   <div class="row"><div class="k">Matching courses</div><div class="courses">${n.c}</div></div>
   <div class="row"><div class="k">Learn first</div><div>${chips(n.p,"pre")}</div></div>
   <div class="row"><div class="k">Unlocks</div><div>${chips(n.k,"next")}</div></div>
   <div class="row"><div class="k">Career</div><div>${used.length?"Required for: "+used.join(", "):""}${used.length&&bon.length?"<br>":""}${bon.length?"Bonus for: "+bon.join(", "):""}${!used.length&&!bon.length?'<span class="none">Not listed for any career</span>':""}</div></div>
   <div class="row"><div class="k">Size</div><div class="none stat">${anc.size} prerequisites · leads to ${desc.size} topics</div></div>${lecHTML(id)}`;
  bindChips();
  if(scroll){const gEl=document.getElementById("graph"),p=pos[id];gEl.scrollTo({left:Math.max(0,p.x-gEl.clientWidth/2+W/2),top:Math.max(0,p.y-gEl.clientHeight/2),behavior:"smooth"})}
}
function selectCareer(k){
  clear();legend("career");pick.value="";car.value=k;
  const c=CAR[k],req=new Set(c.r),bon=new Set(c.b),path=new Set();
  c.r.forEach(id=>walk(id,"p",path));
  N.forEach(n=>{const g=nodeEls[n.id];
    if(req.has(n.id))g.classList.add("req");else if(bon.has(n.id))g.classList.add("bonus");else if(path.has(n.id))g.classList.add("path");else g.classList.add("dim")});
  const on=new Set([...req,...path]);
  edges.forEach(e=>{if(on.has(e.from)&&on.has(e.to))e.path.classList.add("path");else e.path.classList.add("dim")});
  const pre=[...path].filter(x=>!req.has(x)).sort((a,b)=>dep[a]-dep[b]);
  document.getElementById("panel").innerHTML=`
   <h2>${c.l}<span class="badge">Career</span></h2>
   <div class="row"><div class="k">Required (${c.r.length})</div><div>${chips(c.r,"req")}</div></div>
   <div class="row"><div class="k">Bonus (${c.b.length})</div><div>${chips(c.b,"bonus")}</div></div>
   <div class="row"><div class="k">Prerequisites (${pre.length})</div><div>${chips(pre,"pre")}</div></div>
   <div class="row"><div class="k">Size</div><div class="none stat">Finishing every required topic means learning ${req.size+pre.length} topics (${N.length} in the full tree)</div></div>`;
  bindChips();
}
selectCareer("qr");
</script>

</body></html>
